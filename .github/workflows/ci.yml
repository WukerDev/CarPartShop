name: CarPartShop CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-and-tests:
    name: Backend Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
        continue-on-error: true

      - name: Fallback Setup .NET SDK
        if: steps.setup-dotnet.outcome != 'success'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend Solution
        run: dotnet restore src/Backend/CarPartShop.Backend.sln

      - name: Build Backend Solution
        run: dotnet build src/Backend/CarPartShop.Backend.sln --no-restore -c Release

      - name: Run Backend Unit Tests
        run: dotnet test src/Backend/CarPartShop.Backend.Tests/CarPartShop.Backend.Tests.csproj -c Release --no-build --verbosity normal

  gateway-build:
    name: Gateway Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
        continue-on-error: true

      - name: Fallback Setup .NET SDK
        if: steps.setup-dotnet.outcome != 'success'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Gateway Solution
        run: dotnet restore src/Gateway/CarPartShop.Gateway.sln

      - name: Build Gateway Solution
        run: dotnet build src/Gateway/CarPartShop.Gateway.sln --no-restore -c Release

  frontend-build-and-e2e:
    name: Frontend Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/Frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: src/Frontend
        run: npm ci

      - name: Run Frontend Unit Tests
        working-directory: src/Frontend
        run: npm run test:unit

      - name: Frontend Build
        working-directory: src/Frontend
        run: npm run build

      - name: Install Playwright Browsers
        working-directory: src/Frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        working-directory: src/Frontend
        run: npx playwright test

  package-somee-release:
    name: Package Somee.com Deployment Release
    runs-on: ubuntu-latest
    needs: [backend-and-tests, frontend-build-and-e2e]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Frontend SPA
        working-directory: src/Frontend
        run: |
          npm ci
          npm run build

      - name: Publish Backend with Embedded SPA
        run: |
          dotnet publish src/Backend/CarPartShop.Backend/CarPartShop.Backend.csproj -c Release -o dist-package
          mkdir -p dist-package/wwwroot
          cp -r src/Frontend/dist/* dist-package/wwwroot/
          cp src/Backend/CarPartShop.Backend/appsettings.Somee.json dist-package/appsettings.json
          cp src/Backend/CarPartShop.Backend/web.config dist-package/web.config

      - name: Upload Somee Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: somee-iis-package
          path: dist-package/
          retention-days: 14
