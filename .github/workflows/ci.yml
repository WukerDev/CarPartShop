name: CarPartShop CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-and-tests:
    name: Backend Build & Unit Tests (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
        continue-on-error: true

      - name: Fallback Setup .NET SDK if 10 is preview
        if: steps.setup-dotnet.outcome != 'success'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend Solution
        run: dotnet restore src/Backend/CarPartShop.Backend.sln

      - name: Build Backend Solution
        run: dotnet build src/Backend/CarPartShop.Backend.sln --no-restore -c Release

      - name: Run Backend Unit Tests (xUnit, FluentAssertions)
        run: dotnet test src/Backend/CarPartShop.Backend.Tests/CarPartShop.Backend.Tests.csproj -c Release --no-build --verbosity normal

  gateway-build:
    name: Gateway Build (YARP Reverse Proxy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
        continue-on-error: true

      - name: Fallback Setup .NET SDK
        if: steps.setup-dotnet.outcome != 'success'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Gateway Solution
        run: dotnet restore src/Gateway/CarPartShop.Gateway.sln

      - name: Build Gateway Solution
        run: dotnet build src/Gateway/CarPartShop.Gateway.sln --no-restore -c Release

  frontend-build-and-e2e:
    name: Frontend Build & End-to-End Tests (Vue 3, Vuetify, Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/Frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: src/Frontend
        run: npm ci

      - name: Frontend Build (vue-tsc & Vite)
        working-directory: src/Frontend
        run: npm run build

      - name: Install Playwright Browsers
        working-directory: src/Frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        working-directory: src/Frontend
        run: npx playwright test
