server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location /portal/ {
        try_files $uri $uri/ /portal/index.html;
    }

    location = /portal {
        try_files /portal/index.html =404;
    }

    location / {
        try_files $uri $uri/ /portal/index.html;
    }
}
