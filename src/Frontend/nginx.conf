server {
    listen 80;
    server_name localhost;

    location /portal/ {
        alias /usr/share/nginx/html/portal/;
        try_files $uri $uri/ /portal/index.html;
    }

    location = /portal {
        return 301 /portal/;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /portal/index.html /index.html;
    }
}
